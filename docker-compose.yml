services:
  laravel_app:
    container_name: "laravel_praktika"
    build: .
    ports:
    - "8083:80"
    volumes:
    - "./www:/var/www/html"
    depends_on:
      - pgsql
  pgsql:
    container_name: "pgsql2"
    image: postgres:17.2
    ports:
      - "5434:5432"
    volumes:
      - "./data:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: pgsql